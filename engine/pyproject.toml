[project]
name = "aupub"
version = "1.0.0"
description = "AI-University: Enterprise AI Knowledge Publishing engine"
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "markdown>=3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aupub", "aupub.generators", "aupub.exporters", "aupub.knowledge"]
