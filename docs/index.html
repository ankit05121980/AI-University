<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI-University — Enterprise AI Knowledge Publishing Platform</title>
<meta name="description" content="A complete AI learning publishing system: 500+ enterprise-grade AI books, searchable, viewable and downloadable as PDF, DOCX, PPTX, HTML and Markdown." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <div class="brand-title">AI-University</div>
          <div class="brand-sub">Knowledge Press</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a data-route="dashboard" class="nav-item"><span class="ni">◆</span> Dashboard</a>
        <a data-route="library" class="nav-item"><span class="ni">▤</span> Library</a>
        <a data-route="categories" class="nav-item"><span class="ni">▦</span> Categories</a>
        <a data-route="search" class="nav-item"><span class="ni">⌕</span> Search</a>
        <a data-route="diagrams" class="nav-item"><span class="ni">◈</span> Diagram Browser</a>
        <a data-route="downloads" class="nav-item"><span class="ni">⤓</span> Download Center</a>
        <a data-route="paths" class="nav-item"><span class="ni">⇲</span> Learning Paths</a>
        <a data-route="certifications" class="nav-item"><span class="ni">✦</span> Certification Paths</a>
        <a data-route="favorites" class="nav-item"><span class="ni">★</span> Favorites</a>
        <a data-route="bookmarks" class="nav-item"><span class="ni">⚑</span> Bookmarks</a>
      </nav>
      <div class="sidebar-foot">
        <div id="sidebar-stats" class="mini-stats"></div>
        <button id="theme-toggle" class="theme-toggle">Toggle theme</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
        <div class="global-search">
          <input id="global-search-input" type="search" placeholder="Search 500+ books, chapters and topics…" />
        </div>
        <div class="topbar-actions">
          <span id="progress-pill" class="pill"></span>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    window.mermaid = mermaid;
    mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "loose" });
    window.renderMermaid = async (root) => {
      const nodes = root ? [...root.querySelectorAll("pre.mermaid")] : null;
      if (nodes && nodes.length) await mermaid.run({ nodes });
      else await mermaid.run({ querySelector: "pre.mermaid" });
    };
  </script>
  <script src="app.js"></script>
</body>
</html>
