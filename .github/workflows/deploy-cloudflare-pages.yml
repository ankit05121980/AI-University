name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - "scripts/deploy-cloudflare.sh"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Cloudflare Pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy portal to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ai-university
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice title=Cloudflare skipped::Add repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable deploy."
            exit 0
          fi
          chmod +x scripts/deploy-cloudflare.sh
          ./scripts/deploy-cloudflare.sh

      - name: Deployment URL
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Live at https://ai-university.pages.dev"
          fi
